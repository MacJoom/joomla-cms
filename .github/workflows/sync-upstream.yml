name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *' # Every six hours, UTC
  workflow_dispatch:      # Also allows running it manually

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Joomla development branch
        env:
          GH_TOKEN: ${{ github.token }}
          FORK: ${{ github.repository }}
        run: |
          gh repo sync "$FORK" \
            --source joomla/joomla-cms \
            --branch 6.2-dev
