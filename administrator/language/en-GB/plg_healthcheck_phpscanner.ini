PLG_HEALTHCHECK_PHPSCANNER="HealthCheck - PHP Scanner"
PLG_HEALTHCHECK_PHPSCANNER_XML_DESCRIPTION="This HealthCheck plugin scans stored content (articles and modules) for PHP code artifacts such as &lt;?php tags, which should never appear in content and may indicate left-over or injected code."

PLG_HEALTHCHECK_PHPSCANNER_TYPE_ARTICLE="Article"
PLG_HEALTHCHECK_PHPSCANNER_TYPE_MODULE="Module"

PLG_HEALTHCHECK_PHPSCANNER_GROUP_LABEL="Dashboard Context"
PLG_HEALTHCHECK_PHPSCANNER_GROUP_DESC="The context (dashboard group) this check belongs to. It must match the 'context' parameter of the Health Check module instance that should display this check."

PLG_HEALTHCHECK_PHPSCANNER_PHPCONTENT_LISTTEXT="Content with PHP artifacts"
PLG_HEALTHCHECK_PHPSCANNER_ARTICLES_LISTTEXT="Articles with PHP artifacts"
PLG_HEALTHCHECK_PHPSCANNER_ARTICLES_LISTNOTE="Scans the intro and full text of all articles for PHP opening tags."

PLG_HEALTHCHECK_PHPSCANNER_MODULES_LISTTEXT="Modules with PHP artifacts"
PLG_HEALTHCHECK_PHPSCANNER_MODULES_LISTNOTE="Scans the content of all modules (e.g. Custom HTML) for PHP opening tags."

PLG_HEALTHCHECK_PHPSCANNER_SOURCERER_LISTTEXT="Content with Sourcerer code tags"
PLG_HEALTHCHECK_PHPSCANNER_SOURCERER_LISTNOTE="Scans articles and modules for Sourcerer (Regular Labs) {source} tags, which execute embedded PHP/JavaScript."

PLG_HEALTHCHECK_PHPSCANNER_DEPRECONTENT_LISTTEXT="Content with deprecated API calls"
PLG_HEALTHCHECK_PHPSCANNER_DEPRECONTENT_LISTNOTE="Scans embedded code in articles and modules for deprecated legacy Joomla APIs (e.g. JFactory, JText, JRoute)."

PLG_HEALTHCHECK_PHPSCANNER_DEPREOVERRIDES_LISTTEXT="Overrides with deprecated API calls"
PLG_HEALTHCHECK_PHPSCANNER_DEPREOVERRIDES_LISTNOTE="Scans template override files (templates/*/html) for deprecated legacy Joomla APIs (e.g. JFactory, JText, JRoute)."

PLG_HEALTHCHECK_PHPSCANNER_DEPRETOKENS_LABEL="Deprecated API tokens"
PLG_HEALTHCHECK_PHPSCANNER_DEPRETOKENS_DESC="The tokens treated as deprecated code, one per line or comma separated. Used by both deprecated-code checks. Leave empty to use the built-in default list."

PLG_HEALTHCHECK_PHPSCANNER_REDEFINE_LISTTEXT="Extensions redefining legacy classes"
PLG_HEALTHCHECK_PHPSCANNER_REDEFINE_LISTNOTE="Flags installed third-party extensions that ship their own redefinitions of outdated Joomla classes/functions (e.g. JLoader::registerAlias, function jimport). Core extensions are not scanned."
PLG_HEALTHCHECK_PHPSCANNER_REDEFINEPATTERNS_LABEL="Redefinition patterns"
PLG_HEALTHCHECK_PHPSCANNER_REDEFINEPATTERNS_DESC="Code fragments that indicate a legacy class/function redefinition, one per line. Leave empty to use the built-in defaults: JLoader::registerAlias(, function jimport, function jexit, function jdebug."
PLG_HEALTHCHECK_PHPSCANNER_GETREDEFINE_ERROR="Could not scan extensions for legacy class/function redefinitions."

PLG_HEALTHCHECK_PHPSCANNER_SHIMS_LISTTEXT="Extensions with compatibility shims"
PLG_HEALTHCHECK_PHPSCANNER_SHIMS_LISTNOTE="Flags installed third-party extensions that ship guarded compatibility shims or polyfills (definitions wrapped in negated function_exists/class_exists/interface_exists/trait_exists checks). Bundled vendor libraries and core extensions are not scanned."
PLG_HEALTHCHECK_PHPSCANNER_GETSHIMS_ERROR="Could not scan extensions for compatibility shims."

PLG_HEALTHCHECK_PHPSCANNER_MALWARE_LISTTEXT="Suspicious PHP files (possible malware)"
PLG_HEALTHCHECK_PHPSCANNER_MALWARE_LISTNOTE="Scans all PHP files on the site for webshell / obfuscation signatures. The full-site scan is cached and runs in the background."
PLG_HEALTHCHECK_PHPSCANNER_MALWARESIG_LABEL="Malware signatures"
PLG_HEALTHCHECK_PHPSCANNER_MALWARESIG_DESC="Regular expressions (without delimiters), one per line, matched case-insensitively. Leave empty to use the built-in defaults."
PLG_HEALTHCHECK_PHPSCANNER_MALWAREEXCL_LABEL="Excluded directories"
PLG_HEALTHCHECK_PHPSCANNER_MALWAREEXCL_DESC="Directory names to skip during the scan, one per line or comma separated. Leave empty to use the defaults (node_modules, .git, .svn)."
PLG_HEALTHCHECK_PHPSCANNER_GETMALWARE_ERROR="Could not scan the filesystem for malware signatures."

PLG_HEALTHCHECK_PHPSCANNER_RECENTFILES_LISTTEXT="PHP files outside a regular install"
PLG_HEALTHCHECK_PHPSCANNER_RECENTFILES_LISTNOTE="PHP files that belong to no installed extension (orphans), or that were modified after their extension was installed. Files outside the normal install structure may indicate a planted shell."
PLG_HEALTHCHECK_PHPSCANNER_RECENTFILES_LISTNOTE_DESC="Lists PHP files that are not part of a registered extension, or that changed after their extension was installed (compared against each extension's manifest date). The full-site walk is cached and runs in the background."
PLG_HEALTHCHECK_PHPSCANNER_RECENTFILES_REASON_ORPHAN="no extension"
PLG_HEALTHCHECK_PHPSCANNER_RECENTFILES_REASON_CHANGED="changed after install"
PLG_HEALTHCHECK_PHPSCANNER_RECENTFILESEXCL_LABEL="Excluded directories"
PLG_HEALTHCHECK_PHPSCANNER_RECENTFILESEXCL_DESC="Directory names to skip, one per line or comma separated. Leave empty to use the defaults (cache, tmp, logs, node_modules, .git, .svn, manifests, build, tests)."
PLG_HEALTHCHECK_PHPSCANNER_GETRECENTFILES_ERROR="Could not scan the filesystem for files outside a regular install."

PLG_HEALTHCHECK_PHPSCANNER_EXTLIST_LISTTEXT="Third-party extensions and install dates"
PLG_HEALTHCHECK_PHPSCANNER_EXTLIST_LISTNOTE="Lists the installed non-core (third-party) extensions with their install/update time (the modification time of their manifest), newest first. Package children are grouped under their package."
PLG_HEALTHCHECK_PHPSCANNER_GETEXTLIST_ERROR="Could not build the installed-extensions list."

PLG_HEALTHCHECK_PHPSCANNER_CHECKISDEACTIVATED="This check is deactivated in the plugin options."

PLG_HEALTHCHECK_PHPSCANNER_GETARTICLES_ERROR="Could not scan articles for PHP artifacts."
PLG_HEALTHCHECK_PHPSCANNER_GETMODULES_ERROR="Could not scan modules for PHP artifacts."
PLG_HEALTHCHECK_PHPSCANNER_GETSOURCERER_ERROR="Could not scan content for Sourcerer code tags."
PLG_HEALTHCHECK_PHPSCANNER_GETDEPRECONTENT_ERROR="Could not scan content for deprecated API calls."
PLG_HEALTHCHECK_PHPSCANNER_GETDEPREOVERRIDES_ERROR="Could not scan overrides for deprecated API calls."

PLG_HEALTHCHECK_PHPSCANNER_LOGGING_LABEL="Error Logging"
PLG_HEALTHCHECK_PHPSCANNER_LOGGING_DESC="Where to report errors and warnings raised by this plugin."
PLG_HEALTHCHECK_PHPSCANNER_LOGGING_VALUE_NOLOG="Do not log"
PLG_HEALTHCHECK_PHPSCANNER_LOGGING_VALUE_PHPLOG="PHP error log"
PLG_HEALTHCHECK_PHPSCANNER_LOGGING_VALUE_JOOMLALOG="Joomla log"
PLG_HEALTHCHECK_PHPSCANNER_LOGGING_VALUE_MESSAGE="On-screen message"
